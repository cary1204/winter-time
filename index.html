<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Winter Night</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stars" aria-hidden="true"></div>
    <div class="moon" aria-hidden="true"></div>
    <canvas id="snow" aria-hidden="true"></canvas>
    <canvas id="sky" aria-hidden="true"></canvas>
    <div id="sky-tooltip" class="sky-tooltip" role="tooltip" hidden></div>
    <svg
      class="mountains"
      viewBox="0 0 1440 400"
      preserveAspectRatio="xMidYMax slice"
      aria-hidden="true"
    >
      <polygon
        class="m-back"
        points="0,400 0,260 120,170 220,250 340,140 470,260 600,190 720,270 860,150 990,255 1100,180 1220,250 1340,160 1440,240 1440,400"
      />
      <g class="snow-caps">
        <polygon points="120,170 95,189 108,184 120,194 132,184 145,190" />
        <polygon points="340,140 317,161 329,156 340,166 351,156 363,161" />
        <polygon points="600,190 580,201 590,198 600,206 610,198 620,203" />
        <polygon points="860,150 835,171 848,166 860,176 872,166 885,170" />
        <polygon points="1100,180 1080,194 1090,190 1100,198 1110,190 1120,192" />
        <polygon points="1340,160 1318,177 1329,172 1340,182 1351,172 1362,178" />
      </g>
      <polygon
        class="m-mid"
        points="0,400 0,310 90,250 190,320 300,230 420,330 540,270 650,335 780,250 900,330 1010,280 1130,340 1250,265 1360,325 1440,290 1440,400"
      />
      <polygon
        class="m-front"
        points="0,400 0,350 140,310 260,360 400,320 520,365 660,335 800,372 940,330 1080,368 1220,335 1340,365 1440,345 1440,400"
      />
    </svg>

    <main class="content">
      <time id="clock" class="clock">--:--</time>
      <p class="motto">Happy Winter!</p>
      <p id="sky-info" class="sky-info"></p>
    </main>

<section class="player" aria-label="Music player">
  <div id="disk" class="disk" aria-hidden="true">
    <span class="disk-label"></span>
  </div>

  <p id="track-artist" class="track-artist"></p>
  <p id="track-name" class="track-name"></p>

  <input
    id="progress"
    class="progress"
    type="range"
    min="0"
    max="1"
    step="any"
    value="0"
    aria-label="Track position"
  />
  <div class="controls">
    <button id="prev-btn" class="ctrl" type="button" aria-label="Previous track">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 5h2v14H6zM18 5v14L9 12z" />
      </svg>
    </button>

    <button id="play-btn" class="ctrl ctrl-play" type="button" aria-label="Play">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="icon-play" d="M8 5v14l11-7z" />
        <path class="icon-pause" d="M6 5h4v14H6zM14 5h4v14h-4z" />
      </svg>
    </button>

    <button id="next-btn" class="ctrl" type="button" aria-label="Next track">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 5v14l9-7zM16 5h2v14h-2z" />
      </svg>
    </button>
  </div>
  <div class="volume-row">
  <button id="mute-btn" class="ctrl ctrl-small" type="button" aria-label="Mute">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path class="icon-volume" d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z" />
      <path class="icon-muted" d="M3 9v6h4l5 4V5L7 9H3zM16.6 8.6 15.2 10l2 2-2 2 1.4 1.4 2-2 2 2 1.4-1.4-2-2 2-2-1.4-1.4-2 2z" />
    </svg>
  </button>
  <input
    id="volume"
    class="volume-slider"
    type="range"
    min="0"
    max="1"
    step="0.01"
    value="0.7"
    aria-label="Volume"
  />
</div>
</section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
